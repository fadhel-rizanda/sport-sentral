syntax = "proto3";

package user.v1;

option go_package = "microservice-golang/gen/user/v1;userv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "common/v1/common.proto";

// ─── Messages ─────────────────────────────────────────────────────────────────

message UserRole {
  common.v1.RoleSimple role = 1;
  common.v1.StatusSimple status = 2;
  google.protobuf.Timestamp expired_at = 3;
}

message User {
  string    id             = 1;
  string    email          = 2;
  string    username       = 3;
  string    full_name      = 4;
  common.v1.StatusSimple status = 5;
  repeated UserRole roles  = 6;
  google.protobuf.Timestamp created_at  = 7;
  google.protobuf.Timestamp updated_at  = 8;
  google.protobuf.Timestamp verified_at = 9;
  optional google.protobuf.Timestamp deleted_at = 10;
}

// ─── Requests ─────────────────────────────────────────────────────────────────

message CreateUserRequest {
  string email = 1 [
    (buf.validate.field).string.email = true,
    (buf.validate.field).string.max_len = 255
  ];
  string username = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 50,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9_]+$"
  ];
  string full_name = 3 [
    (buf.validate.field).string.max_len = 100
  ];
  string password = 4 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 72
  ];
  string role_id = 5 [
    (buf.validate.field).string.uuid = true
  ];
}

message GetUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message UpdateUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string full_name = 2 [(buf.validate.field).string.max_len = 100];
  optional string username = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 50,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9_]*$"
  ];
}

message DeleteUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string password = 2 [
    (buf.validate.field).string.min_len = 1
  ];
}

message ListUsersRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 2 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100
  ];
}

message SendVerifyEmailRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}

message VerifyAccountRequest {
  string token = 1 [(buf.validate.field).string.len = 36];
}

message ForgotPasswordRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}

message ResetPasswordRequest {
  string token = 1 [(buf.validate.field).string.len = 36];
  string password = 2 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 72
  ];
}

message AssignRolesToUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  repeated string role_ids = 2 [
    (buf.validate.field).repeated = {
      min_items: 1,
      max_items: 50,
      items: { string: { uuid: true } }
    }
  ];
}

message RemoveRolesFromUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  repeated string role_ids = 2 [
    (buf.validate.field).repeated = {
      min_items: 1,
      max_items: 50,
      items: { string: { uuid: true } }
    }
  ];
}

// ─── Responses ────────────────────────────────────────────────────────────────

message CreateUserResponse {
  User user = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserResponse {
  User user = 1;

}

message DeleteUserResponse   {}

message ListUsersResponse {
  repeated User users = 1;
  int64 total     = 2;
  int32 page      = 3;
  int32 page_size = 4;
}
message SendVerifyEmailResponse {}

message VerifyAccountResponse   {}

message ForgotPasswordResponse  {}

message ResetPasswordResponse   {}

message AssignRolesToUserResponse {}

message RemoveRolesFromUserResponse {}

// ─── Service ──────────────────────────────────────────────────────────────────

service UserService {
  rpc CreateUser      (CreateUserRequest)      returns (CreateUserResponse);
  rpc GetUser         (GetUserRequest)         returns (GetUserResponse);
  rpc UpdateUser      (UpdateUserRequest)      returns (UpdateUserResponse);
  rpc DeleteUser      (DeleteUserRequest)      returns (DeleteUserResponse);
  rpc ListUsers       (ListUsersRequest)       returns (ListUsersResponse);
  rpc SendVerifyEmail (SendVerifyEmailRequest) returns (SendVerifyEmailResponse);
  rpc VerifyAccount   (VerifyAccountRequest)   returns (VerifyAccountResponse);
  rpc ForgotPassword  (ForgotPasswordRequest)  returns (ForgotPasswordResponse);
  rpc ResetPassword   (ResetPasswordRequest)   returns (ResetPasswordResponse);

  rpc AssignRolesToUser  (AssignRolesToUserRequest)  returns (AssignRolesToUserResponse);
  rpc RemoveRolesFromUser(RemoveRolesFromUserRequest)returns (RemoveRolesFromUserResponse);
}