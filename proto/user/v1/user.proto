syntax = "proto3";

package user.v1;

option go_package = "microservice-golang/gen/user/v1;userv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// ─── Messages ─────────────────────────────────────────────────────────────────

message UserProfile {
  string role_id   = 1;
  string role_name = 2;
  bool   is_active = 3;
  string status    = 4;
}

message User {
  string    id             = 1;
  string    email          = 2;
  string    username       = 3;
  string    full_name      = 4;
  string    status         = 5;
  string    active_profile = 6;
  repeated UserProfile profiles = 7;
  google.protobuf.Timestamp created_at  = 8;
  google.protobuf.Timestamp updated_at  = 9;
  google.protobuf.Timestamp verified_at = 10;
}

// ─── Requests ─────────────────────────────────────────────────────────────────

message CreateUserRequest {
  string email = 1 [
    (buf.validate.field).string.email = true,
    (buf.validate.field).string.max_len = 255
  ];
  string username = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 50,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9_]+$"
  ];
  string full_name = 3 [
    (buf.validate.field).string.max_len = 100
  ];
  string password = 4 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 72
  ];
  string role_name = 5 [
    (buf.validate.field).string.min_len = 1
  ];
}

message GetUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message UpdateUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string full_name = 2 [(buf.validate.field).string.max_len = 100];
  string username = 3 [
    (buf.validate.field).string.max_len = 50,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9_]*$"
  ];
}

message DeleteUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ListUsersRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 2 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100
  ];
}

message SendVerifyEmailRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}

message VerifyAccountRequest {
  string token = 1 [(buf.validate.field).string.len = 36];
}

message ForgotPasswordRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}

message ResetPasswordRequest {
  string token = 1 [(buf.validate.field).string.len = 36];
  string password = 2 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 72
  ];
}

// ─── Responses ────────────────────────────────────────────────────────────────

message CreateUserResponse   { User user = 1; }
message GetUserResponse      { User user = 1; }
message UpdateUserResponse   { User user = 1; }
message DeleteUserResponse   {}
message ListUsersResponse {
  repeated User users = 1;
  int64 total     = 2;
  int32 page      = 3;
  int32 page_size = 4;
}
message SendVerifyEmailResponse {}
message VerifyAccountResponse   {}
message ForgotPasswordResponse  {}
message ResetPasswordResponse   {}

// ─── Service ──────────────────────────────────────────────────────────────────

service UserService {
  rpc CreateUser      (CreateUserRequest)      returns (CreateUserResponse);
  rpc GetUser         (GetUserRequest)         returns (GetUserResponse);
  rpc UpdateUser      (UpdateUserRequest)      returns (UpdateUserResponse);
  rpc DeleteUser      (DeleteUserRequest)      returns (DeleteUserResponse);
  rpc ListUsers       (ListUsersRequest)       returns (ListUsersResponse);
  rpc SendVerifyEmail (SendVerifyEmailRequest) returns (SendVerifyEmailResponse);
  rpc VerifyAccount   (VerifyAccountRequest)   returns (VerifyAccountResponse);
  rpc ForgotPassword  (ForgotPasswordRequest)  returns (ForgotPasswordResponse);
  rpc ResetPassword   (ResetPasswordRequest)   returns (ResetPasswordResponse);
}