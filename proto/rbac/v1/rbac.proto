syntax = "proto3";

package rbac.v1;

option go_package = "microservice-golang/gen/rbac/v1;rbacv1";

import "buf/validate/validate.proto";

// ─── Requests ─────────────────────────────────────────────────────────────────

message ApplyProfileRequest {
  string user_id   = 1 [(buf.validate.field).string.uuid = true];
  string role_name = 2 [(buf.validate.field).string.min_len = 1];
}


message ToggleProfileRequest {
  string user_id   = 1 [(buf.validate.field).string.uuid = true];
  string role_name = 2 [(buf.validate.field).string.min_len = 1];
}

message ApproveProfileRequest {
  string user_id   = 1 [(buf.validate.field).string.uuid = true];
  string role_name = 2 [(buf.validate.field).string.min_len = 1];
}

message RejectProfileRequest {
  string user_id   = 1 [(buf.validate.field).string.uuid = true];
  string role_name = 2 [(buf.validate.field).string.min_len = 1];
}

// ─── Responses ────────────────────────────────────────────────────────────────

message ApplyProfileResponse {}

message ToggleProfileResponse {}

message ApproveProfileResponse {}

message RejectProfileResponse {}

// ─── Service ──────────────────────────────────────────────────────────────────

service RBACService {
  rpc ApplyProfile   (ApplyProfileRequest)   returns (ApplyProfileResponse);
  rpc ToggleProfile  (ToggleProfileRequest)  returns (ToggleProfileResponse);
  rpc ApproveProfile (ApproveProfileRequest) returns (ApproveProfileResponse);
  rpc RejectProfile  (RejectProfileRequest)  returns (RejectProfileResponse);
}
