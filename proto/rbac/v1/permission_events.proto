syntax = "proto3";

package rbac.v1;

option go_package = "microservice-golang/gen/rbac/v1;rbacv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ─── Enum ─────────────────────────────────────────────────────────────────────
enum PermissionEventType {
  PERMISSION_EVENT_TYPE_UNSPECIFIED = 0;
  PERMISSION_EVENT_TYPE_CREATED     = 1;
  PERMISSION_EVENT_TYPE_UPDATED     = 2;
  PERMISSION_EVENT_TYPE_DELETED     = 3;
}

// ─── Event envelope ───────────────────────────────────────────────────────────
message PermissionEvent {
  string event_id = 1 [
    (buf.validate.field).string.uuid = true
  ];

  PermissionEventType event_type = 2 [
    (buf.validate.field).enum.defined_only = true
  ];

  google.protobuf.Timestamp occurred_at = 3 [
    (buf.validate.field).required = true
  ];

  // The ID of the permission associated with this event
  string permission_id = 4 [
    (buf.validate.field).string.uuid = true
  ];

  string permission_resource = 6 [
    (buf.validate.field).string.min_len = 1
  ];

  string permission_action = 7 [
    (buf.validate.field).string.min_len = 1
  ];

  string permission_slug = 8 [
    (buf.validate.field).string.min_len = 1
  ];

  optional google.protobuf.Timestamp deleted_at = 9;
}