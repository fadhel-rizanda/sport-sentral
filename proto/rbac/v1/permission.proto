syntax = "proto3";

package rbac.v1;

option go_package = "microservice-golang/gen/rbac/v1;rbacv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// ─── Message ──────────────────────────────────────────────────────────────────

message Permission {
  string id          = 1;
  string resource    = 2;
  string action      = 3;
  string description = 4;
  string created_by_id = 5;
  string updated_by_id = 6;
  optional string deleted_by_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional google.protobuf.Timestamp deleted_at = 10;
}

// ─── Requests ─────────────────────────────────────────────────────────────────

message CreatePermissionRequest {
  string resource = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  string action = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  string description = 3 [
    (buf.validate.field).string.max_len = 255
  ];
  string created_by_id = 4 [
    (buf.validate.field).string.uuid = true
  ];
}

message UpdatePermissionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2 [
    (buf.validate.field).string.max_len = 50
  ];
  optional string resource = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  optional string action = 4[
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  optional string description = 5 [
    (buf.validate.field).string.max_len = 255
  ];
  string updated_by_id = 6 [
    (buf.validate.field).string.uuid = true
  ];
}

message GetPermissionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeletePermissionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string deleted_by_id = 2 [
    (buf.validate.field).string.uuid = true
  ];
  bool is_permanent = 3;
}

message ListPermissionsRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 2 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100
  ];
  optional string role_id = 3 [(buf.validate.field).string.uuid = true];
}

message CheckPermissionRequest {
  string user_id  = 1 [(buf.validate.field).string.uuid = true];
  string resource = 2 [(buf.validate.field).string.min_len = 1];
  string action   = 3 [(buf.validate.field).string.min_len = 1];
}

// ─── Responses ────────────────────────────────────────────────────────────────

message CreatePermissionResponse {
  Permission permission = 1;
}

message UpdatePermissionResponse {
  Permission permission = 1;
}

message GetPermissionResponse {
  Permission permission = 1;
}

message DeletePermissionResponse {}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
  int64 total     = 2;
  int32 page      = 3;
  int32 page_size = 4;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

service PermissionService {
  rpc CreatePermission (CreatePermissionRequest) returns (CreatePermissionResponse);
  rpc GetPermission    (GetPermissionRequest)    returns (GetPermissionResponse);
  rpc UpdatePermission (UpdatePermissionRequest) returns (UpdatePermissionResponse);
  rpc DeletePermission (DeletePermissionRequest) returns (DeletePermissionResponse);
  rpc ListPermissions  (ListPermissionsRequest)  returns (ListPermissionsResponse);
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse);
}