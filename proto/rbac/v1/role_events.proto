syntax = "proto3";

package rbac.v1;

option go_package = "microservice-golang/gen/rbac/v1;rbacv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ─── Enum ─────────────────────────────────────────────────────────────────────
enum RoleEventType {
  ROLE_EVENT_TYPE_UNSPECIFIED = 0;
  ROLE_EVENT_TYPE_CREATED     = 1;
  ROLE_EVENT_TYPE_UPDATED     = 2;
  ROLE_EVENT_TYPE_DELETED     = 3;
}

// ─── Event envelope ───────────────────────────────────────────────────────────
message RoleEvent {
  string event_id = 1 [
    (buf.validate.field).string.uuid = true
  ];

  RoleEventType event_type = 2 [
    (buf.validate.field).enum.defined_only = true
  ];

  google.protobuf.Timestamp occurred_at = 3 [
    (buf.validate.field).required = true
  ];

  // The ID of the role associated with this event
  string role_id = 4 [
    (buf.validate.field).string.uuid = true
  ];

  string role_name = 5 [
    (buf.validate.field).string.min_len = 1
  ];

  string role_slug = 6 [
    (buf.validate.field).string.min_len = 1
  ];

  repeated string permission_ids = 7 [
    (buf.validate.field).repeated.items.string.uuid = true
  ];

  optional google.protobuf.Timestamp deleted_at = 8;
}