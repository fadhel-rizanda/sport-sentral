syntax = "proto3";

package sport.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "sport/v1/regulator.proto";

option go_package = "microservice-golang/gen/sport/v1;sportv1";

// ─── messages ─────────────────────────────────────────────────────────────────

message Sport {
  string id                     = 1;
  string name                   = 2;
  string slug                   = 3;
  string description            = 4;
  string icon_attachment_id     = 5;

  common.v1.StatusSimple status = 6;
  common.v1.TagSimple tier_tag  = 7;

  Regulator active_regulator    = 8;
  SportConfig config            = 9;

  int32 total_competitions      = 10;
  int32 total_athletes          = 11;
  int32 total_academies         = 12;

  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message SportStat {
  string id               = 1;
  string sport_id         = 2;
  string stat_type_tag_id = 3;
  common.v1.TagSimple stat_type_tag = 4;
  string aggregation_method = 5; // e.g. "SUM", "AVG", "MAX", "MIN"
}

message SportConfig {
  string id                     = 1;
  string sport_id               = 2;

  repeated SportStat stats      = 3;

  common.v1.TagSimple participant_type_tag = 4;
  int32 min_roster_size                 = 5;
  int32 max_roster_size                 = 6;
  int32 typical_roster_size             = 7;

  string rules_url              = 8;
  string description            = 9;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

