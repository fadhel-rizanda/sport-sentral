// ─── requests ─────────────────────────────────────────────────────────────────

message CreateSportRequest {
  string name               = 1 [(buf.validate.field).string = {min_len: 2, max_len: 100}];
  string slug               = 2 [(buf.validate.field).string = {min_len: 2, max_len: 100}];
  string description        = 3 [(buf.validate.field).string.min_len = 10];
  string icon_attachment_id = 4;
  string tier_tag_id        = 5 [(buf.validate.field).string.uuid = true];
  string status_id          = 6 [(buf.validate.field).string.uuid = true];
  string created_by_id      = 7 [(buf.validate.field).string.uuid = true];
}

message GetSportRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ListSportsRequest {
  optional string tier_tag_id    = 1 [(buf.validate.field).string.uuid = true];
  optional string status_id      = 2 [(buf.validate.field).string.uuid = true];
  optional string search         = 3;
  int32 page                     = 4;
  int32 page_size                = 5;
}

message ListSportsResponse {
  repeated Sport sports = 1;
  int64 total           = 2;
  int32 page            = 3;
  int32 page_size       = 4;
}

message UpdateSportRequest {
  string id                     = 1 [(buf.validate.field).string.uuid = true];
  optional string name          = 2;
  optional string description   = 3;
  optional string icon_attachment_id = 4;
  optional string tier_tag_id   = 5;
  optional string status_id     = 6;
  string updated_by_id          = 7 [(buf.validate.field).string.uuid = true];
}

message DeleteSportRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message SportStatConfigInput {
  string stat_type_tag_id   = 1 [(buf.validate.field).string.uuid = true];
  string aggregation_method = 2 [(buf.validate.field).string.min_len = 2];
}

message UpdateSportConfigRequest {
  string sport_id                    = 1 [(buf.validate.field).string.uuid = true];
  repeated SportStatConfigInput stats = 2;
  string participant_type_tag_id     = 3 [(buf.validate.field).string.uuid = true];
  int32 min_roster_size              = 4 [(buf.validate.field).int32.gt = 0];
  int32 max_roster_size              = 5 [(buf.validate.field).int32.gt = 0];
  int32 typical_roster_size          = 6 [(buf.validate.field).int32.gt = 0];
  optional string rules_url          = 7;
  optional string description        = 8;
  string updated_by_id               = 9 [(buf.validate.field).string.uuid = true];
}

message GetSportConfigRequest {
  string sport_id = 1 [(buf.validate.field).string.uuid = true];
}

// ─── Service ─────────────────────────────────────────────────────────────────

service SportService {
  // Sport Management
  rpc GetSport(GetSportRequest) returns (Sport);
  rpc ListSports(ListSportsRequest) returns (ListSportsResponse);
  rpc CreateSport(CreateSportRequest) returns (Sport);
  rpc UpdateSport(UpdateSportRequest) returns (Sport);
  rpc DeleteSport(DeleteSportRequest) returns (google.protobuf.Empty);

  // Sport Configuration
  rpc UpdateSportConfig(UpdateSportConfigRequest) returns (SportConfig);
  rpc GetSportConfig(GetSportConfigRequest) returns (SportConfig);
}