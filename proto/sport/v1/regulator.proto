syntax = "proto3";

package sport.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";
import "common/v1/common.proto";

option go_package = "microservice-golang/gen/sport/v1;sportv1";

// ─── messages ─────────────────────────────────────────────────────────────────

message Regulator {
  string id                         = 1;
  string organization_name          = 2;
  string code                       = 3;
  string logo_attachment_id         = 4;
  string contact_email              = 5;
  string phone_number               = 6;
  string website_url                = 7;

  common.v1.StatusSimple status     = 8;
  repeated RegulatorStaff staff     = 9;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message RegulatorStaff {
  string id                         = 1;
  string regulator_id               = 2;
  string user_id                    = 3;

  common.v1.UserSimple user         = 4;
  common.v1.TagSimple role_tag      = 5;

  google.protobuf.Timestamp joined_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ─── requests ─────────────────────────────────────────────────────────────────

message GetRegulatorRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message CreateRegulatorRequest {
  string organization_name  = 1 [(buf.validate.field).string.min_len = 3];
  string code               = 2 [(buf.validate.field).string.min_len = 2];
  string contact_email      = 3 [(buf.validate.field).string.email = true];
  optional string phone_number = 4;
  optional string website_url  = 5;
  string logo_attachment_id = 6;
  string street_address     = 7 [(buf.validate.field).string.min_len = 3];
  optional string address_notes = 8;
  optional double latitude  = 9;
  optional double longitude = 10;
  string administrative_division_id = 11 [(buf.validate.field).string.uuid = true];
  string status_id          = 12 [(buf.validate.field).string.uuid = true];
  string created_by_id      = 13 [(buf.validate.field).string.uuid = true];
}

message AddStaffRequest {
  string regulator_id               = 1 [(buf.validate.field).string.uuid = true];
  string user_id                    = 2 [(buf.validate.field).string.uuid = true];
  string role_tag_id                = 3 [(buf.validate.field).string.uuid = true]; // ID Role dari meta-service
  string created_by_id              = 4 [(buf.validate.field).string.uuid = true];
}

message RemoveStaffRequest {
  string staff_id                   = 1 [(buf.validate.field).string.uuid = true];
  string deleted_by_id              = 2 [(buf.validate.field).string.uuid = true];
}

message AssignSportToRegulatorRequest {
  string sport_id                   = 1 [(buf.validate.field).string.uuid = true];
  string regulator_id               = 2 [(buf.validate.field).string.uuid = true];
  bool requires_approval_for_official = 3;
  bool requires_approval_for_regional = 4;
  string updated_by_id              = 5 [(buf.validate.field).string.uuid = true];
}

// ─── Service ─────────────────────────────────────────────────────────────────

service RegulatorService {
  rpc CreateRegulator(CreateRegulatorRequest) returns (Regulator);
  rpc GetRegulator(GetRegulatorRequest) returns (Regulator);

  rpc AddRegulatorStaff(AddStaffRequest) returns (RegulatorStaff);
  rpc RemoveRegulatorStaff(RemoveStaffRequest) returns (google.protobuf.Empty);

  rpc AssignSportToRegulator(AssignSportToRegulatorRequest) returns (google.protobuf.Empty);
}