syntax = "proto3";

package meta.v1;

option go_package = "microservice-golang/gen/meta/v1;metav1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ─── Enum ─────────────────────────────────────────────────────────────────────
enum TagEventType {
  TAG_EVENT_TYPE_UNSPECIFIED = 0;
  TAG_EVENT_TYPE_CREATED     = 1;
  TAG_EVENT_TYPE_UPDATED     = 2;
  TAG_EVENT_TYPE_DELETED     = 3;
}

// ─── Event envelope ───────────────────────────────────────────────────────────
message TagEvent {
  string event_id = 1 [
    (buf.validate.field).string.uuid = true
  ];

  TagEventType event_type = 2 [
    (buf.validate.field).enum.defined_only = true
  ];

  google.protobuf.Timestamp occurred_at = 3 [
    (buf.validate.field).required = true
  ];

  // The ID of the tag associated with this event
  string tag_id = 4 [
    (buf.validate.field).string.uuid = true
  ];

  string tag_type = 5 [
    (buf.validate.field).string.min_len = 1
  ];

  string tag_name = 6 [
    (buf.validate.field).string.min_len = 1
  ];

  string tag_slug = 7 [
    (buf.validate.field).string.min_len = 1
  ];

  optional google.protobuf.Timestamp deleted_at = 8;
}