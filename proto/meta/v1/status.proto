syntax = "proto3";

package meta.v1;

option go_package = "microservice-golang/gen/meta/v1;metav1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// ─── Messages ─────────────────────────────────────────────────────────────────

message Status {
  string id      = 1;
  string type    = 2;
  string name    = 3;
  common.v1.UserSimple created_by = 4;
  common.v1.UserSimple updated_by = 5;
  optional common.v1.UserSimple deleted_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  optional google.protobuf.Timestamp deleted_at = 9;
  string slug = 10;
}

// ─── Requests ────────────────────────────────────────────────────────────────

message CreateStatusRequest {
  string type = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  string created_by_id = 3 [
    (buf.validate.field).string.uuid = true
  ];
  string slug = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z0-9-]+$"
  ];
}

message GetStatusRequest {
  string type = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  string name = 2 [
    (buf.validate.field).string.min_len = 1
  ];
}

message GetStatusByIDRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true
  ];
}

message ListStatusesRequest {
  optional string type = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  int32 page = 2 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 3 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100
  ];
}

message UpdateStatusRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true
  ];
  optional string type = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  optional string name = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  string updated_by_id = 4 [
    (buf.validate.field).string.uuid = true
  ];
  optional string slug = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z0-9-]+$"
  ];
}

message DeleteStatusRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true
  ];
  string deleted_by_id = 2 [
    (buf.validate.field).string.uuid = true
  ];
  bool is_permanent = 3;
}

// ─── Responses ────────────────────────────────────────────────────────────────

message CreateStatusResponse {
  Status status = 1;
}

message GetStatusResponse {
  Status status = 1;
}

message GetStatusByIDResponse {
  Status status = 1;
}

message ListStatusesResponse {
  repeated Status statuses = 1;
  int64 total     = 2;
  int32 page      = 3;
  int32 page_size = 4;
}

message UpdateStatusResponse {
  Status status = 1;
}

message DeleteStatusResponse {
  string id = 1;
}

// ─── Services ────────────────────────────────────────────────────────────────

service StatusService {
  rpc CreateStatus(CreateStatusRequest) returns (CreateStatusResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetStatusByID(GetStatusByIDRequest) returns (GetStatusByIDResponse);
  rpc ListStatuses(ListStatusesRequest) returns (ListStatusesResponse);
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);
  rpc DeleteStatus(DeleteStatusRequest) returns (DeleteStatusResponse);
}