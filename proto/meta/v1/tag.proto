syntax = "proto3";

package meta.v1;

option go_package = "microservice-golang/gen/meta/v1;metav1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// ─── Messages ─────────────────────────────────────────────────────────────────

message Tag {
  string id         = 1;
  string type       = 2;
  string name       = 3;
  string slug       = 4;
  common.v1.UserSimple created_by = 5;
  common.v1.UserSimple updated_by = 6;
  optional common.v1.UserSimple deleted_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional google.protobuf.Timestamp deleted_at = 10;
}

// ─── Requests ────────────────────────────────────────────────────────────────

message CreateTagRequest {
  string type = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  string slug = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z0-9-]+$"
  ];
  string created_by_id = 4 [
    (buf.validate.field).string.uuid = true
  ];
}

message GetTagRequest {
  string type = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  string name = 2 [
    (buf.validate.field).string.min_len = 1
  ];
}

message GetTagByIDRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true
  ];
}

message ListTagsRequest {
  optional string type = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  int32 page = 2 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 3 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100
  ];
}

message UpdateTagRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true
  ];
  optional string type = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  optional string name = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];
  optional string slug = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z0-9-]+$"
  ];
  string updated_by_id = 5 [
    (buf.validate.field).string.uuid = true
  ];
}

message DeleteTagRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true
  ];
  string deleted_by_id = 2 [
    (buf.validate.field).string.uuid = true
  ];
  bool is_permanent = 3;
}

// ─── Responses ────────────────────────────────────────────────────────────────

message CreateTagResponse {
  Tag tag = 1;
}

message GetTagResponse {
  Tag tag = 1;
}

message ListTagsResponse {
  repeated Tag tags = 1;
  int64 total     = 2;
  int32 page      = 3;
  int32 page_size = 4;
}

message UpdateTagResponse {
  Tag tag = 1;
}

message DeleteTagResponse {}

// ─── Service ──────────────────────────────────────────────────────────────────

service TagService {
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc GetTag(GetTagRequest) returns (GetTagResponse);
  rpc GetTagByID(GetTagByIDRequest) returns (GetTagResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc UpdateTag(UpdateTagRequest) returns (UpdateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
}