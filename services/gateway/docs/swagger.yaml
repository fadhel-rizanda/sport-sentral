paths:
  /academy/admins:
    get:
      parameters:
      - description: Filter Academy ID
        in: query
        name: academy_id
        type: string
      - description: Filter Branch ID
        in: query
        name: branch_id
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Number of items per page (default 10)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AcademyAdminResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get list of academy admins
      tags:
      - Academies
    post:
      consumes:
      - application/json
      parameters:
      - description: Academy Admin Data
        in: body
        name: request
        required: true
        schema:
          type: object
