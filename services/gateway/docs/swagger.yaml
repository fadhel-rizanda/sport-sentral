    email: dev@sportsentral.id
    name: Sport-Sentral Development Team
  description: Centralized API Documentation for Sport-Sentral Microservices Gateway
    (Auth, RBAC, Academy, Venue, Sport, Competition, Scout, Attachment, Log).
